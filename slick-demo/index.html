<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slick Demo</title>
  <meta name="description" content="Slick Demo">
  <meta name="author" content="John Gray">
  <!-- Third Party Stylesheets go here -->
  <!-- Add to head before local style sheet -->
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"/>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- Content -->
  <main>
    <div class="fade container">
      <div><img src="assets/img/1.jpg" alt="Carousel image 1"></div>
      <div><img src="assets/img/2.jpg" alt="Carousel image 2"></div>
      <div><img src="assets/img/3.jpg" alt="Carousel image 3"></div>
      <div><img src="assets/img/4.jpg" alt="Carousel image 4"></div>
    </div>
  </main>
  
  <!-- Third Party Scripts: jQuery + Slick -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
  
  <!-- Local initialization script -->
  <script src="assets/js/scripts.js"></script>
</body>
</html>
